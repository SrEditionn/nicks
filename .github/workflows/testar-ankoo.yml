name: Testar Ankoo (sem publicar)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir sintaxe
        run: |
          node --check functions/api/roblox.js
          node --check public/main.js
          node --check public/amigos/app.js
      - name: Testar autenticação, lista e Roblox
        run: |
          node tests/test-auth.mjs
          node tests/test-list.mjs
          node tests/test-api.mjs
          python3 tests/verificar_arquivos.py

      - name: Diagnosticar Roblox real (somente leitura; não causa falha)
        continue-on-error: true
        run: node tests/diagnosticar-pose-roblox.mjs

      - name: Diagnosticar links diretos no site publicado
        continue-on-error: true
        run: node tests/diagnosticar-rotas.mjs

      - name: Diagnosticar implantação principal Cloudflare (sem divulgar segredos)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: node tests/diagnosticar-producao-cloudflare.mjs

      - name: Confirmar deploy automatico e testar rotas no dominio principal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: node tests/verificar-deploy-publico.mjs
