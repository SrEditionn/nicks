name: Corrigir build Cloudflare Pages Ankoo

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  corrigir:
    if: github.event.head_commit.message == 'Corrigir build automatico Ankoo'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ajustar diretorio de saida sem alterar banco ou segredos
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: node scripts/corrigir-build-cloudflare.mjs
