name: Publicar no Cloudflare Pages (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir arquivos
        run: |
          test -f public/index.html
          test -f public/amigos/index.html
          test -f functions/api/roblox.js
          test -f functions/api/auth.js
          test -f src/auth.js
          node tests/test-auth.mjs
          node tests/test-list.mjs
          node tests/test-api.mjs
          python3 tests/verificar_arquivos.py
      - name: Publicar no projeto Pages existente
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Falta CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Falta CLOUDFLARE_ACCOUNT_ID' && exit 1)
          test -n "$PROJECT_NAME" || (echo 'Falta a variável CLOUDFLARE_PAGES_PROJECT' && exit 1)
          npx --yes wrangler@4 pages deploy public --project-name "$PROJECT_NAME" --branch main