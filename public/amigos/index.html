<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#10131b"><title>ANKOO · Amigos Roblox</title>
<link rel="stylesheet" href="/amigos/style.css"><link rel="stylesheet" href="/minimal.css"><link rel="stylesheet" href="/admin.css"><script src="/admin.js" defer></script><script src="/amigos/app.js" defer></script></head><body>
<div class="page"><header class="site-header"><a class="brand" href="/">ANKOO</a><nav><a class="header-link" href="/">Nicks salvos ↗</a><span id="admin-anchor"></span></nav></header>
<main class="simple-main"><section class="simple-top friend-top"><div><h1>Amigos Roblox</h1><p id="storage-status" class="storage-status">Conectando lista...</p></div></section>
<form id="search-form" class="search-form"><label class="visually-hidden" for="profile-url">URL do perfil Roblox</label><div class="input-wrap"><input id="profile-url" type="text" spellcheck="false" autocomplete="off" placeholder="Cole o link ou ID do perfil" required></div><button type="submit" id="submit-button">Buscar amigos →</button></form>
<section id="results" class="results is-hidden" aria-live="polite"><div class="results-heading"><div class="profile-summary"><div id="source-avatar" class="source-avatar"><span>R</span></div><div class="source-data"><h2 id="source-name">Carregando...</h2><div class="profile-actions"><a id="source-link" href="#" target="_blank" rel="noopener noreferrer">Abrir perfil ↗</a><button id="source-add" class="source-add" type="button" disabled>+ Adicionar</button></div></div></div><div class="friend-totals"><strong id="friends-count">0</strong> amigos<span id="pages-count" hidden>0</span></div></div>
<div class="progress-wrap" id="progress-wrap"><div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div><span id="progress-text">Buscando...</span></div>
<div class="toolbar"><label class="filter-wrap"><input id="filter" type="search" placeholder="Buscar amigo" autocomplete="off"></label><div class="tools-right"><select id="size-select" aria-label="Tamanho dos cards"><option value="regular">Normal</option><option value="large">Grande</option><option value="compact">Compacto</option></select><span id="visible-count" class="visible-count" hidden></span></div></div>
<div id="gallery" class="gallery"></div><div id="empty-filter" class="empty-filter is-hidden">Nenhum amigo encontrado.</div></section><div id="notice" class="notice is-hidden" role="status"></div></main></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
</body></html>
